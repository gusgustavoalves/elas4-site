<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elas 4 Semijoias</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@200;300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --fundo: #030303;
            --texto: #ffffff;
            --dourado: #d4af37;
            --rose: #e6b3b3;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--fundo); color: var(--texto); font-family: 'Montserrat', sans-serif; }
        h1, h2, .serif { font-family: 'Playfair Display', serif; }

        /* HEADER / HERO */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: radial-gradient(circle at center, #1a1a1a 0%, #030303 80%);
            padding: 20px;
        }
        .hero img { max-width: 220px; border-radius: 50%; margin-bottom: 40px; box-shadow: 0 0 50px rgba(229, 179, 179, 0.1); }
        .hero h1 { font-size: 3rem; letter-spacing: 8px; color: var(--rose); margin-bottom: 10px; text-transform: uppercase; }
        .hero p { font-size: 1.2rem; font-weight: 300; letter-spacing: 3px; color: var(--dourado); font-style: italic; margin-bottom: 50px; }
        
        .btn-primario {
            padding: 15px 40px;
            border: 1px solid var(--rose);
            color: var(--rose);
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 0.8rem;
            transition: all 0.4s;
            background: transparent;
        }
        .btn-primario:hover { background-color: var(--rose); color: var(--fundo); }

        /* CATEGORIAS LUXURY TEXT */
        .vitrine { padding: 100px 20px; text-align: center; }
        .vitrine h2 { font-size: 2rem; color: var(--dourado); margin-bottom: 60px; letter-spacing: 2px; }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .card {
            padding: 60px 20px;
            border: 1px solid rgba(212, 175, 55, 0.15);
            background: linear-gradient(145deg, #0a0a0a, #030303);
            transition: all 0.5s;
            cursor: pointer;
        }
        .card:hover { border-color: var(--dourado); transform: translateY(-10px); box-shadow: 0 10px 30px rgba(212, 175, 55, 0.05); }
        .card h3 { font-size: 1.2rem; letter-spacing: 4px; color: #fff; text-transform: uppercase; transition: color 0.3s; }
        .card:hover h3 { color: var(--rose); }

        /* FOOTER */
        footer { padding: 80px 20px; text-align: center; border-top: 1px solid rgba(255,255,255,0.05); }
        footer p { font-weight: 200; color: #888; max-width: 600px; margin: 0 auto 30px auto; line-height: 1.8; }
    </style>
</head>
<body>

    <section class="hero">
        <img src="Logo elas 4.jpeg" alt="Logo Elas 4 Semijoias">
        <h1>Elas 4</h1>
        <p class="serif">Quatro irmãs, uma paixão por brilhar.</p>
        <a href="historia.html" class="btn-primario">Conheça Nossa História</a>
    </section>

    <section class="vitrine">
        <h2>Nossa Coleção</h2>
        <div class="grid">
            <div class="card"><h3>Brincos</h3></div>
            <div class="card"><h3>Pulseiras</h3></div>
            <div class="card"><h3>Anéis</h3></div>
            <div class="card"><h3>Colares</h3></div>
            <div class="card"><h3>Outros</h3></div>
        </div>
    </section>

    <footer>
        <p>Estamos preparando os últimos detalhes de peças escolhidas a dedo pela nossa família, para entregar a você a melhor qualidade com valores justos.</p>
        <p style="font-size: 0.8rem; letter-spacing: 2px; color: var(--dourado);">EM BREVE</p>
    </footer>

</body>
</html>
