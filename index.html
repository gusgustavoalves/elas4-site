<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elas 4 Semijoias</title>
    <style>
        body {
            background-color: #050505; /* Fundo preto elegante */
            color: #d4af37; /* Dourado */
            font-family: 'Georgia', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .logo-container img {
            max-width: 300px;
            border-radius: 50%; /* Deixa a logo com bordas suaves se precisar */
            margin-bottom: 20px;
        }
        h1 {
            font-size: 2.5em;
            letter-spacing: 5px;
            margin-bottom: 10px;
            color: #e6b3b3; /* Tom rose gold da logo */
        }
        p {
            font-size: 1.2em;
            font-style: italic;
            margin-bottom: 40px;
            color: #d4af37;
        }
        .breve {
            font-family: 'Arial', sans-serif;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: 1px solid #d4af37;
            padding: 10px 20px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <!-- Quando subirmos a imagem, ela vai aparecer aqui -->
        <img src="Logo elas 4.jpeg" alt="Logo Elas 4 Semijoias">
    </div>

    <h1>ELAS 4</h1>
    <p>Quatro irmãs, uma paixão por brilhar.</p>
    
    <div class="breve">
        Nossa loja online está chegando...
    </div>

</body>
</html>
