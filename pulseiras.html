<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brincos | Elas 4 Semijoias</title>
    <link rel="icon" href="Logo elas 4.jpeg" type="image/jpeg">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@200;300;400&display=swap" rel="stylesheet">
    <style>
        :root { --fundo: #030303; --texto: #ffffff; --dourado: #d4af37; --rose: #e6b3b3; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--fundo); color: var(--texto); font-family: 'Montserrat', sans-serif; text-align: center; }
        h1, .serif { font-family: 'Playfair Display', serif; }
        
        .header-categoria {
            padding: 80px 20px 40px 20px;
            background: linear-gradient(to bottom, rgba(10,10,10,1), var(--fundo));
        }
        .header-categoria h1 { font-size: 2.5rem; color: var(--rose); letter-spacing: 6px; text-transform: uppercase; margin-bottom: 15px; }
        .header-categoria p { color: #aaa; font-weight: 300; font-size: 1.1rem; max-width: 600px; margin: 0 auto; line-height: 1.6; }

        .catalogo-futuro {
            padding: 60px 20px;
            margin: 40px auto;
            max-width: 800px;
            border: 1px dashed rgba(212, 175, 55, 0.3);
            border-radius: 8px;
        }
        .catalogo-futuro h2 { color: var(--dourado); font-size: 1.5rem; letter-spacing: 3px; margin-bottom: 10px; }
        .catalogo-futuro p { color: #666; font-style: italic; }

        .btn-voltar {
            display: inline-block;
            margin: 40px 0 80px 0;
            padding: 12px 30px;
            border: 1px solid rgba(255,255,255,0.3);
            color: #fff;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.8rem;
            transition: all 0.4s;
        }
        .btn-voltar:hover { border-color: var(--dourado); color: var(--dourado); }
    </style>
</head>
<body>

    <div class="header-categoria">
        <h1>Pulseiras</h1>
        <p>Elegância em cada movimento. Encontre a peça perfeita para compor o seu estilo e carregar um brilho sutil no seu pulso.</p>
    </div>

    <div class="catalogo-futuro">
        <h2 class="serif">Em breve, nosso catálogo completo.</h2>
        <p>As fotos das nossas peças exclusivas estarão disponíveis aqui logo após o lançamento.</p>
    </div>

    <a href="index.html" class="btn-voltar">Voltar para a Página Inicial</a>

</body>
</html>
